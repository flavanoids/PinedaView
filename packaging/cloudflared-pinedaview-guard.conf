# Drop-in for cloudflared.service (/etc/systemd/system/cloudflared.service.d/
# pineda-web-guard.conf): systemd puts the tunnel's cgroup in
# pineda_web_guard's @tunnel_units set each time it starts, so the tunnel can never
# reach the dashboard port, whatever its ingress rules say. Add the same
# drop-in to any other tunnel or reverse-proxy unit on a pineda-web host.
[Unit]
After=pineda-web-guard.service

[Service]
NFTSet=cgroup:inet:pineda_web_guard:tunnel_units
