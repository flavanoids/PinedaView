# SPDX-License-Identifier: Apache-2.0
# Kiosk-local proxy for primary/standby pineda-web. The kiosk's Chromium loads
# http://127.0.0.1:8090/ and this forwards to whichever server
# pineda-failover.sh has written into pineda-upstream.conf.
#
#   sudo install -m 644 packaging/pineda-failover.nginx.conf /etc/nginx/sites-available/pineda
#   sudo ln -sf ../sites-available/pineda /etc/nginx/sites-enabled/pineda
#
# Also set `worker_shutdown_timeout 3s;` in nginx.conf's main context: without
# it a reload leaves the old worker holding the kiosk's SSE stream to the old
# server indefinitely, and the screen never switches.
upstream pineda {
    include /etc/nginx/pineda-upstream.conf;
    keepalive 4;
}

server {
    listen 127.0.0.1:8090;

    location / {
        proxy_pass http://pineda;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # SSE (/api/stream) must reach the browser as it's written.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        client_max_body_size 64m;
    }
}
