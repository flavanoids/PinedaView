<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PinedaDisplay Web</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pineda" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <script>
      try {
        const p = new URLSearchParams(location.search);
        const pi = p.get("pi") || localStorage.getItem("pineda.platformPi");
        if (
          pi === "1" ||
          (!p.has("preview") &&
            pi !== "0" &&
            !/android|iphone|ipad|ipod/i.test(navigator.userAgent) &&
            (/raspbian|\braspberry pi\b/i.test(navigator.userAgent) ||
              /linux (armv6l|armv7l|aarch64)/i.test(navigator.userAgent)))
        ) {
          document.documentElement.dataset.platform = "pi";
        }
        if (p.has("preview")) {
          document.documentElement.dataset.preview = "true";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
